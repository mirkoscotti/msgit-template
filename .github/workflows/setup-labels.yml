name: Setup Labels

on:
  push:
    branches: 
      - main
    paths:
      - '.github/configuration/labels.yml'

permissions:
  issues: write
  contents: read

jobs:

  setup-labels:
    runs-on: ubuntu-latest
    
    steps:
    
      - name: Checkout repository
        uses: actions/checkout@v4
    
      - name: Create Labels
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/configuration/labels.yml